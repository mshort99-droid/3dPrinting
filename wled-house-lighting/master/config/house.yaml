          col: [255, 180, 80]

      Top Shelves Off:
        - controller: under_bar
          segment: underbar4
          power: false
        - controller: bar_shelves
          segment: shelf14
          power: false
        - controller: bar_shelves_2
          segment: shelf24
          power: false
