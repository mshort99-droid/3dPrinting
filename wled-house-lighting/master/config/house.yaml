zones:
  bar:
    controllers:
      under_bar:
        display_name: Under Bar
        host: 192.168.4.24
        segments:
          underbar1: 0
          underbar2: 1
          underbar3: 2
          underbar4: 3
      bar_shelves:
        display_name: Bar Shelf 1
        host: 192.168.4.38
        # segment N = position N counting from the bottom shelf up
        segments:
          shelf11: 0
          shelf12: 1
          shelf13: 2
          shelf14: 3
      bar_shelves_2:
        display_name: Bar Shelf 2
        host: 192.168.4.39
        # segment N = position N counting from the bottom shelf up
        segments:
          shelf21: 0
          shelf22: 1
          shelf23: 2
          shelf24: 3

    # Friendlier labels for the UI only - scenes/actions still address
    # segments by their real name above. Edit freely; nothing else depends
    # on the text here.
    segment_names:
      underbar1: Rail 1
      underbar2: Rail 2
      underbar3: Rail 3
      underbar4: Rail 4
      shelf11: Shelf 1
      shelf12: Shelf 2
      shelf13: Shelf 3
      shelf14: Shelf 4
      shelf21: Shelf 1
      shelf22: Shelf 2
      shelf23: Shelf 3
      shelf24: Shelf 4

    # Each scene is a list of actions. An action targets a controller and
    # either:
    #   - preset: <id>            applies a whole-controller WLED preset, or
    #   - segment: <name>         plus power/col/fx/bri to drive one segment
    #                              directly (no preset needed on the device).
    #                              NOTE: use "power", not "on" - YAML 1.1
    #                              parses bare on/off as booleans, which
    #                              silently corrupts a literal "on:" key.
    # Multiple actions for the same controller are combined into one command.
    # NOTE: scenes use segment actions exclusively, not WLED "preset:"
    # actions, even though these controllers do have presets saved on them.
    # Found out the hard way (2026-09-27): a preset saved before a
    # controller's segments were split can bundle its own OLD segment
    # layout, and applying it silently collapses/renames the current
    # segments back to that old layout. Segment-based actions can't have
    # this problem since they only ever touch the segment they name.
    # Scenes apply the same per-position color to all 3 controllers'
    # segments (position 1 = bottom/first, 4 = top/last), so all three
    # stay visually consistent with each other.
    scenes:
      Just Lit:
        - controller: under_bar
          segment: underbar1
          power: true
          col: [255, 255, 255]
        - controller: under_bar
          segment: underbar2
          power: true
          col: [255, 255, 255]
        - controller: under_bar
          segment: underbar3
          power: true
          col: [255, 255, 255]
        - controller: under_bar
          segment: underbar4
          power: true
          col: [255, 255, 255]
        - controller: bar_shelves
          segment: shelf11
          power: true
          col: [255, 255, 255]
        - controller: bar_shelves
          segment: shelf12
          power: true
          col: [255, 255, 255]
        - controller: bar_shelves
          segment: shelf13
          power: true
          col: [255, 255, 255]
        - controller: bar_shelves
          segment: shelf14
          power: true
          col: [255, 255, 255]
        - controller: bar_shelves_2
          segment: shelf21
          power: true
          col: [255, 255, 255]
        - controller: bar_shelves_2
          segment: shelf22
          power: true
          col: [255, 255, 255]
        - controller: bar_shelves_2
          segment: shelf23
          power: true
          col: [255, 255, 255]
        - controller: bar_shelves_2
          segment: shelf24
          power: true
          col: [255, 255, 255]

      Christmas:
        - controller: under_bar
          segment: underbar1
          power: true
          col: [255, 0, 0]
        - controller: under_bar
          segment: underbar2
          power: true
          col: [0, 200, 0]
        - controller: under_bar
          segment: underbar3
          power: true
          col: [255, 0, 0]
        - controller: under_bar
          segment: underbar4
          power: true
          col: [0, 200, 0]
        - controller: bar_shelves
          segment: shelf11
          power: true
          col: [255, 0, 0]
        - controller: bar_shelves
          segment: shelf12
          power: true
          col: [0, 200, 0]
        - controller: bar_shelves
          segment: shelf13
          power: true
          col: [255, 0, 0]
        - controller: bar_shelves
          segment: shelf14
          power: true
          col: [0, 200, 0]
        - controller: bar_shelves_2
          segment: shelf21
          power: true
          col: [255, 0, 0]
        - controller: bar_shelves_2
          segment: shelf22
          power: true
          col: [0, 200, 0]
        - controller: bar_shelves_2
          segment: shelf23
          power: true
          col: [255, 0, 0]
        - controller: bar_shelves_2
          segment: shelf24
          power: true
          col: [0, 200, 0]

      The Blues:
        - controller: under_bar
          segment: underbar1
          power: true
          col: [0, 80, 255]
        - controller: under_bar
          segment: underbar2
          power: true
          col: [0, 80, 255]
        - controller: under_bar
          segment: underbar3
          power: true
          col: [0, 80, 255]
        - controller: under_bar
          segment: underbar4
          power: true
          col: [0, 80, 255]
        - controller: bar_shelves
          segment: shelf11
          power: true
          col: [0, 80, 255]
        - controller: bar_shelves
          segment: shelf12
          power: true
          col: [0, 80, 255]
        - controller: bar_shelves
          segment: shelf13
          power: true
          col: [0, 80, 255]
        - controller: bar_shelves
          segment: shelf14
          power: true
          col: [0, 80, 255]
        - controller: bar_shelves_2
          segment: shelf21
          power: true
          col: [0, 80, 255]
        - controller: bar_shelves_2
          segment: shelf22
          power: true
          col: [0, 80, 255]
        - controller: bar_shelves_2
          segment: shelf23
          power: true
          col: [0, 80, 255]
        - controller: bar_shelves_2
          segment: shelf24
          power: true
          col: [0, 80, 255]

      Warm White (all shelves):
        - controller: under_bar
          segment: underbar1
          power: true
          col: [255, 180, 80]
        - controller: under_bar
          segment: underbar2
          power: true
          col: [255, 180, 80]
        - controller: under_bar
          segment: underbar3
          power: true
          col: [255, 180, 80]
        - controller: under_bar
          segment: underbar4
          power: true
          col: [255, 180, 80]
        - controller: bar_shelves
          segment: shelf11
          power: true
          col: [255, 180, 80]
        - controller: bar_shelves
          segment: shelf12
          power: true
          col: [255, 180, 80]
        - controller: bar_shelves
          segment: shelf13
          power: true
          col: [255, 180, 80]
        - controller: bar_shelves
          segment: shelf14
          power: true
          col: [255, 180, 80]
        - controller: bar_shelves_2
          segment: shelf21
          power: true
          col: [255, 180, 80]
        - controller: bar_shelves_2
          segment: shelf22
          power: true
          col: [255, 180, 80]
        - controller: bar_shelves_2
          segment: shelf23
          power: true
          col: [255, 180, 80]
        - controller: bar_shelves_2
          segment: shelf24
