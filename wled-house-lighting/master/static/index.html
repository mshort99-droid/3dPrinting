<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lights</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-title-row">
        <h1 id="zone-title">Bar</h1>
        <div class="conn-dot" id="conn-dot" title="connection"></div>
      </div>

      <div class="control-row">
        <button id="power-toggle" class="power-toggle" title="Turn all bar lights off/on">
          <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17-1.42 1.42A6.92 6.92 0 0 1 19 12a7 7 0 1 1-11.66-5.24L5.92 5.34A9 9 0 1 0 12 3a8.94 8.94 0 0 0-4.66 1.3z"/></svg>
        </button>
        <input type="range" id="master-dimmer" class="dimmer-slider" min="1" max="100" value="100">
      </div>

      <button type="button" class="scene-select-trigger" id="scene-select-trigger" aria-haspopup="listbox" aria-expanded="false">
        <span class="scene-select-swatch" id="scene-select-swatch"></span>
        <span class="scene-select-label" id="scene-select-label">Select scene&hellip;</span>
        <svg class="chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
    </header>

    <div class="scene-sheet-overlay hidden" id="scene-sheet-overlay">
      <div class="scene-sheet" id="scene-sheet" role="listbox">
        <div class="scene-sheet-handle"></div>
        <div id="scene-sheet-list"></div>
      </div>
    </div>

    <main id="view-dashboard" class="view">
      <section class="section">
        <h2 class="section-title">Controllers</h2>
        <div id="controller-list" class="controller-list"></div>
      </section>
    </main>

    <main id="view-editor" class="view hidden">
      <div id="editor-scene-list"></div>
    </main>

    <main id="view-scene-editor" class="view hidden">
      <div id="scene-editor-content"></div>
    </main>
  </div>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="dashboard">
      <svg viewBox="0 0 24 24"><path d="M4 13h7V4H4v9zm0 7h7v-5H4v5zm9 0h7v-9h-7v9zm0-16v5h7V4h-7z"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="tab-btn" data-view="editor">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      <span>Scenes</span>
    </button>
  </nav>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
