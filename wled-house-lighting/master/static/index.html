<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lights</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1 id="zone-title">Bar</h1>
        <div id="now-playing" class="now-playing"></div>
      </div>
      <div class="conn-dot" id="conn-dot" title="connection"></div>
    </header>

    <main id="view-dashboard" class="view">
      <section class="section">
        <h2 class="section-title">Scenes</h2>
        <div id="scene-grid" class="scene-grid"></div>
      </section>

      <section class="section">
        <h2 class="section-title">Controllers</h2>
        <div id="controller-list" class="controller-list"></div>
      </section>
    </main>

    <main id="view-editor" class="view hidden">
      <div id="editor-scene-list"></div>
    </main>

    <main id="view-scene-editor" class="view hidden">
      <div id="scene-editor-content"></div>
    </main>

    <nav class="tabbar">
      <button class="tab-btn active" data-view="dashboard">
        <svg viewBox="0 0 24 24"><path d="M4 13h7V4H4v9zm0 7h7v-5H4v5zm9 0h7v-9h-7v9zm0-16v5h7V4h-7z"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="tab-btn" data-view="editor">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        <span>Scenes</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/app.js"></script>
</body>
</html>
